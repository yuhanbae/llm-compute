name: llm-compute
on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"
concurrency:
  group: llm-compute
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Download llama.cpp (prebuilt)
        run: |
          curl -sL -m 300 -o llamacpp.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b11529/llama-b11529-bin-ubuntu-x64.tar.gz
          tar xzf llamacpp.tar.gz
          ls llama-b11529/llama-server

      - name: Download uncensored model (Qwen3-4B-Instruct-2507 abliterated, tool-capable)
        run: |
          curl -sL -m 600 -o model.gguf "https://huggingface.co/prithivMLmods/Qwen3-4B-2507-abliterated-GGUF/resolve/main/Qwen3-4B-Instruct-2507-abliterated-GGUF/Qwen3-4B-Instruct-2507-abliterated.Q4_K_M.gguf"
          ls -la model.gguf

      - name: Start llama-server + cloudflared tunnel
        run: |
          curl -sL -m 120 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          start_server () {
            nohup ./llama-b11529/llama-server --host 127.0.0.1 --port 8080 \
              -m model.gguf --jinja -t 2 -c 16384 --alias Dolphin3.0-Llama3.2-3B \
              > server.log 2>&1 &
          }
          start_server
          for i in $(seq 1 60); do
            sleep 5
            if curl -s -m 5 http://127.0.0.1:8080/v1/models | grep -q Qwen3; then echo "llama-server READY"; break; fi
          done
          nohup ./cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > cf.log 2>&1 &
          for i in $(seq 1 40); do
            sleep 5
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1)
            if [ -n "$URL" ]; then echo "TUNNEL URL: $URL"; TUNNEL_URL="$URL"; echo "TUNNEL_URL=$URL" >> $GITHUB_ENV; break; fi
          done
          if [ -z "$TUNNEL_URL" ]; then echo "tunnel failed"; tail -20 cf.log; exit 1; fi
          # publish tunnel URL to the gist (pi's local proxy reads it)
          curl -s -m 20 -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            "https://api.github.com/gists/${{ secrets.HOST_GIST_ID }}" \
            -d "{\"files\":{\"url.txt\":{\"content\":\"$TUNNEL_URL\"}}}" > /dev/null
          echo "gist updated with tunnel url"

      - name: Keep alive, self-heal, chain next run
        run: |
          start_server () {
            nohup ./llama-b11529/llama-server --host 127.0.0.1 --port 8080 \
              -m model.gguf --jinja -t 2 -c 16384 --alias Dolphin3.0-Llama3.2-3B \
              > server.log 2>&1 &
          }
          for i in $(seq 1 345); do
            sleep 60
            if ! curl -s -m 5 http://127.0.0.1:8080/v1/models > /dev/null; then
              echo "server down - restarting"
              pkill -f llama-server || true; sleep 3; start_server; sleep 45
            fi
            if ! pgrep -f "cloudflared tunnel" > /dev/null; then
              echo "tunnel down - restarting"
              nohup ./cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > cf.log 2>&1 &
              sleep 20
            fi
            TURL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1)
            if [ -n "$TURL" ] && [ "$TURL" != "$PUBLISHED" ]; then
              curl -s -m 20 -X PATCH -H "Authorization: Bearer ${{ secrets.GH_PAT }}"                 "https://api.github.com/gists/${{ secrets.HOST_GIST_ID }}"                 -d "{\"files\":{\"url.txt\":{\"content\":\"$TURL\"}}}" > /dev/null
              echo "published $TURL"
              PUBLISHED="$TURL"
            fi
          done
          echo "chaining next run"
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/llm-compute.yml/dispatches" \
            -d '{"ref":"main"}'
